<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1117">

  <!-- SEO: give every semester landing page a specific title + description -->
  <title>N. félév — [Kurzus neve] | Oktatási anyagok | Füles Jegyzetek</title>
  <meta name="description" content="[Egy-két mondatos összefoglaló arról, mit tartalmaz ez a félév.]">
  <link rel="canonical" href="https://fulesjegyzetek.hu/oktatasi-anyagok/[kurzus-slug]/semesterN/">

  <link rel="stylesheet" href="/style.css">
</head>
<!--
  This template is for a rare, deliberate second nesting level: a
  multi-semester course whose landing page lists semesters instead of
  items directly (course -> semester landing -> item). Most courses on
  this site DON'T need this — course-template.html's plain
  course -> item pattern is still the default. Only use this file when
  a course is explicitly organized by semester (see CLAUDE.md's
  Content model section for the confirmed example and rationale).
-->
<body data-nav-key="jegyzetek">
  <!--
    FILE-BASED ROUTING NOTE (read me, then delete):
    Copy this file to /oktatasi-anyagok/<kurzus-slug>/semesterN/index.html —
    one semester-landing page per semester, nested under that course's
    own landing page (course-template.html). See
    /oktatasi-anyagok/deik-mernokinformatikus-bsc-2017/semester1/index.html
    for a filled-in example.

    This is a semester-landing page, not an item page: it lists the
    jegyzet items that belong to one semester of one course, the same
    way a course-landing page lists a course's items. Its own
    card-grid links to item pages copied from jegyzet-template.html,
    placed one level deeper: /oktatasi-anyagok/<kurzus-slug>/semesterN/<itemN>/.
    Each such item's breadcrumb needs an extra "N. félév" segment
    hand-added, since jegyzet-template.html's default breadcrumb has
    no semester level.
  -->

  <div id="site-header"></div>

  <div class="page-shell">
    <main class="content">
      <p class="breadcrumbs"><a href="/">Kezdőlap</a> / <a href="/oktatasi-anyagok/">Oktatási anyagok</a> / <a href="/oktatasi-anyagok/[kurzus-slug]/">[Kurzus neve]</a> / N. félév</p>

      <h1>N. félév</h1>
      <p>
        [Rövid bevezető: mit tartalmaz ez a félév ebben a kurzusban.]
      </p>

      <div class="ad-slot ad-slot--banner">
        <span class="ad-slot__label">Hirdetés</span>
      </div>

      <div class="card-grid">
        <!--
          Add one <a class="item-card"> per jegyzet in this semester as
          you publish it — see jegyzet-template.html. Until the first
          one exists, leave the grid empty and keep the placeholder
          paragraph below instead.
        -->
      </div>
      <p><em>Ehhez a félévhez még nem került fel jegyzet. Hamarosan.</em></p>
    </main>
  </div>

  <div id="site-footer"></div>
  <script src="/script.js" defer></script>
</body>
</html>
